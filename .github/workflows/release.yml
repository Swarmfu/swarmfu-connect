name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    env:
      # Secrets can't be read in a step's `if`, so whether they're set goes through the environment.
      CAN_SIGN: ${{ secrets.MACOS_CERT_P12 != '' }}
      CAN_PUBLISH: ${{ secrets.JSR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun scripts/build.ts --all
      - run: bun scripts/build.ts --all --minecraft
      # macOS signing and notarizing, once the Developer ID secrets exist; unsigned builds ship without them.
      - name: Sign and notarize the macOS builds
        if: env.CAN_SIGN == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          echo "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials swarmfu --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          sh scripts/sign-macos.sh
      - run: sh scripts/package.sh
      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "swarmfu $GITHUB_REF_NAME" \
            dist/release/*
      # A private repo can't be linked on jsr.io, so publishing takes a JSR access token.
      - name: Publish the protocol to JSR
        if: env.CAN_PUBLISH == 'true'
        working-directory: packages/protocol
        env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
        run: bunx jsr publish --allow-slow-types --token "$JSR_TOKEN"
